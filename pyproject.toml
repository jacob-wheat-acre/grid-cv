[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grid-cv"
version = "0.1.0"
description = "Electric distribution asset failure detection from drone imagery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.0.0",
    "sahi>=0.11.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "piexif>=1.1.3",
    "pydantic>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "typer[all]>=0.9.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "albumentations>=1.3.0",
    "pandas>=2.0.0",
    "shapely>=2.0.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[project.scripts]
grid-cv = "grid_cv.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["grid_cv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
